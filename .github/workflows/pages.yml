# Publishes the book. Homework solutions open automatically 2 weeks after each week
# (see release/release.json); runs on every push and every Monday 00:05 Ulaanbaatar time.
name: Publish book
on:
  push:
    branches: [main]
  schedule:
    - cron: "5 16 * * 0"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install lxml
      - run: python3 release/build_public.py site _public
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _public
      - id: deployment
        uses: actions/deploy-pages@v4
